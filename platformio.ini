; PlatformIO Project Configuration File
; ESP32-P4 (M5Stack Tab5) with Arduino Framework

[env:m5stack-tab5]
platform = espressif32
board = esp32-p4
framework = arduino

; ESP32-P4 target
board_build.idf.target = esp32p4

; 16MBフラッシュを使用 (サンプルプロジェクトに準拠)
board_build.partitions = default_16MB.csv
board_upload.offset_address = 0x20000
board_build.flash_mode = qio
board_build.f_flash = 80000000L

build_unflags =
    -Werror

build_flags =
    -O3
    -ffast-math
    -D NDEBUG
    -Wno-error
    -Wno-error=attributes
    -Wno-error=return-type
    -Wno-error=incompatible-pointer-types
    -Wno-incompatible-pointer-types
    -D M5STACK_TAB5
    -D M5GFX_BOARD=board_M5Tab5
    -D BOARD_HAS_PSRAM
    -D IS_CARDPUTER
    -D M5UNIFIED_NO_RMT
    -D LGFX_I2S_PORT_T_COMPAT=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D ARDUINO_LOOP_STACK_SIZE=32768
    -Wdouble-promotion
    -funroll-loops
    -fno-exceptions
    -I src/data
    -I src/lodepng
    -I src/lua
    -I src/lexaloffle

lib_deps =
    m5stack/M5Unified @ ^0.2.19
    https://github.com/kikuchan/pngle.git

monitor_speed = 115200
upload_speed = 921600
build_src_filter = +<*> -<db_installer.cpp>